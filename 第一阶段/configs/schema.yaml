    tail_types: [PER]
    directional: false

  领导:
    head_types: [PER]
    tail_types: [PER]
    directional: true

  职务制约:
    head_types: [PER]
    tail_types: [PER]
    directional: true

  请托:
    head_types: [PER]
    tail_types: [PER]
    directional: true

  转请托:
    head_types: [PER]
    tail_types: [PER]
    directional: true

  指示办事:
